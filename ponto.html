<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raviera Ponto</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#174b25,#060b08 50%);color:#f0fff3;font:16px system-ui,sans-serif;min-height:100vh}main{max-width:960px;margin:auto;padding:25px 16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#32ef68;text-decoration:none}.panel{border:1px solid #285735;background:linear-gradient(145deg,#101d14,#080e0a);padding:23px;border-radius:18px;margin-top:18px}.muted{color:#a3b9a8}.clock{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:900;color:#30ef64;font-variant-numeric:tabular-nums}button{border:0;border-radius:12px;padding:13px 18px;font-weight:850;cursor:pointer;margin:5px;background:#20e650;color:#061109}button:disabled{opacity:.45;cursor:wait}button.secondary{background:#192b20;color:#f0fff3;border:1px solid #285735}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}table{width:100%;border-collapse:collapse}td,th{padding:11px 6px;border-bottom:1px solid #24402c;text-align:left}#msg{white-space:pre-wrap} @media(max-width:720px){.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script></head><body><main><header><div><b style="color:#28f45b">RAVIERAGROUP</b> / PONTO<h1>⏱️ Controle de serviço</h1></div><a href="./index.html">← Voltar ao portal</a></header><p id="msg" class="muted">Conectando ao Supabase...</p><section class="panel"><div class="muted">Motorista identificado</div><h2 id="qra">—</h2><div class="muted" id="status">Carregando...</div><div id="clock" class="clock">00:00:00</div><button id="start" disabled>▶ Entrar em serviço</button><button id="stop" class="secondary" disabled>■ Sair de serviço</button></section><div class="grid"><section class="panel"><h2>Minhas jornadas</h2><p class="muted">Registros individuais</p><div style="overflow:auto"><table><thead><tr><th>Entrada</th><th>Saída</th><th>Duração</th></tr></thead><tbody id="history"></tbody></table></div></section><section class="panel"><h2>🏆 Ranking de horas</h2><p class="muted">Total por QRA (inclui serviços em andamento)</p><div style="overflow:auto"><table><thead><tr><th>#</th><th>QRA</th><th>Horas</th></tr></thead><tbody id="ranking"></tbody></table></div></section></div></main><script src="./raviera-ponto.js"></script></body></html>
